<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="SMG – Sudo Ma Godo: ogni giorno una seduta diversa per bici e corsa">
<title>SMG · Sudo Ma Godo</title>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:Poppins;src:url(fonts/poppins-regular.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:Poppins;src:url(fonts/poppins-medium.woff) format('woff');font-weight:500 600;font-display:swap}
@font-face{font-family:Poppins;src:url(fonts/poppins-bold.woff) format('woff');font-weight:700 900;font-display:swap}
@font-face{font-family:Poppins;src:url(fonts/poppins-bolditalic.woff) format('woff');font-weight:700 900;font-style:italic;font-display:swap}
:root{
  --bg:#0B0C10; --s1:#15171E; --s2:#1D2029; --s3:#252936; --line:#2A2F3D;
  --text:#F4F5F8; --t2:#B9BECC; --mut:#7D8397;
  --hot:#FF4E2E; --hot2:#FFA41C; --lime:#C4FF45;
  --grad:linear-gradient(120deg,#FF4E2E,#FFA41C);
  --indoor:#A393FF; --mtb:#C4FF45; --road:#3FD4FF; --run:#FF6FA0; --strength:#FFC940;
  --green:#3BE889; --yellow:#FFC940; --red:#FF4F5E;
  --r:20px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--hot2)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)} .t2{color:var(--t2)}
svg{display:block}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:10;padding:calc(var(--safe-t) + 12px) 16px 10px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(var(--bg) 75%,rgba(11,12,16,0))}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand img{width:36px;height:36px;border-radius:11px;display:block}
.brand b{font-weight:800;font-style:italic;font-size:22px;letter-spacing:-.5px;line-height:1}
.brand small{display:block;font-size:10.5px;color:var(--mut);letter-spacing:1.6px;text-transform:uppercase;margin-top:3px;font-weight:500}
.wx{display:flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;font-weight:600;white-space:nowrap}
.wx svg{width:22px;height:22px}
.wx .mut{font-weight:500}

main{padding:0 16px calc(104px + var(--safe-b));max-width:560px;margin:0 auto}
.view{display:none;animation:fade .25s ease} .view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hello{margin:4px 2px 14px}
.hello .d{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:1.4px;font-weight:600}
.hello h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.hello h1 em{font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:3px}

/* ---------- card ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.card h3{margin:0 0 12px;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--s2);color:var(--t2)}
.tag{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--s3);color:var(--t2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 16px;font-weight:700;font-size:14.5px;background:var(--s2);border:1px solid var(--line);color:var(--text);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.hot{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 24px -10px rgba(255,78,46,.7)}
.btn.lime{background:var(--lime);border:0;color:#10140A}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn.full{width:100%}
.row{display:flex;gap:10px} .row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- check-in ---------- */
.feel{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.feel button{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--t2)}
.feel button svg{width:30px;height:30px}
.feel button.on{border-color:transparent;background:var(--grad);color:#fff}
.field label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:0 0 5px 2px}
.field .unit{position:relative}
.field .unit input{padding-right:46px}
.field .unit span{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut)}
.src{font-size:12px;color:var(--lime);display:flex;align-items:center;gap:6px;margin:-2px 0 12px}
.src svg{width:14px;height:14px}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--t2);margin:12px 0 14px}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;z-index:2;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:99px;background:var(--s3);transition:.2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--hot)}
.switch input:checked+i::after{transform:translateX(18px)}

.light{display:flex;align-items:center;gap:14px}
.orb{width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:24px;color:#0B0C10;position:relative}
.orb::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid currentColor;opacity:.35}
.orb.green{background:var(--green);color:var(--green)} .orb.yellow{background:var(--yellow);color:var(--yellow)} .orb.red{background:var(--red);color:var(--red)}
.orb span{color:#0B0C10}
.light h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.light p{margin:2px 0 0;color:var(--t2);font-size:13.5px}
.why{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* ---------- workout ---------- */
.wo{padding:0;border:0;background:var(--s1)}
.wo .top{padding:16px 16px 0;position:relative}
.wo .glow{position:absolute;inset:0 0 auto 0;height:160px;opacity:.22;pointer-events:none}
.wo .meta{display:flex;align-items:center;gap:8px;position:relative}
.sporticon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.sporticon svg{width:24px;height:24px}
.wo .meta b{font-size:13px;font-weight:700;display:block;line-height:1.2}
.wo .meta small{font-size:12px;color:var(--mut)}
.lvl{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.dots{display:flex;gap:3px}
.dots i{width:14px;height:6px;border-radius:3px;background:var(--s3)}
.lvl small{font-size:11px;color:var(--mut);font-weight:600}
.wo h2{margin:14px 0 2px;font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.1;position:relative}
.wo .big{display:flex;gap:16px;align-items:baseline;margin:6px 0 12px;position:relative}
.wo .big div{font-size:13px;color:var(--mut)}
.wo .big strong{font-size:22px;font-weight:800;color:var(--text);margin-right:3px}
.chart{margin:0 -2px;position:relative}
.wo .body{padding:4px 16px 16px}
.wo p.desc{color:var(--t2);margin:12px 0}
.challenge{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:12px 14px;background:rgba(196,255,69,.08);border:1px dashed rgba(196,255,69,.45);margin:12px 0}
.challenge svg{width:22px;height:22px;flex:none;color:var(--lime);margin-top:1px}
.challenge b{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--lime)}
.challenge span{font-size:14px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
details.steps{margin-top:12px;border-top:1px solid var(--line)}
details.steps summary{list-style:none;padding:14px 0 6px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer}
details.steps summary::-webkit-details-marker{display:none}
details.steps summary svg{width:18px;height:18px;transition:.2s;margin-left:auto;color:var(--mut)}
details[open].steps summary svg{transform:rotate(180deg)}
.sec{margin:10px 0 4px}
.sec .sh{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);display:flex;gap:8px;align-items:center;margin-bottom:6px}
.sec .sh .rep{background:var(--grad);color:#fff;border-radius:6px;padding:1px 7px;letter-spacing:0}
.stp{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--s2);margin-bottom:5px}
.stp .t{font-weight:700;font-size:14px}
.stp .n{font-size:13.5px;line-height:1.25}
.stp .n small{display:block;color:var(--mut);font-size:11.5px}
.stp .g{font-weight:700;font-size:13px;text-align:right;white-space:nowrap}
.stp .g small{display:block;color:var(--mut);font-size:11px;font-weight:500}
.zbar{width:4px;align-self:stretch;border-radius:3px;position:absolute}
.ctl{margin-top:14px}
.ctl .lab{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:1px;text-transform:uppercase;margin:0 0 6px 2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;background:var(--s2);border:1px solid var(--line);color:var(--t2);white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.actions .wide{grid-column:1/-1}
.done-banner{display:flex;align-items:center;gap:12px;border-radius:16px;padding:14px;background:rgba(59,232,137,.1);border:1px solid rgba(59,232,137,.4);margin-top:14px}
.done-banner svg{width:28px;height:28px;color:var(--green);flex:none}
.done-banner.skip{background:var(--s2);border-color:var(--line)}
.done-banner.skip svg{color:var(--mut)}
.done-banner b{display:block}
.done-banner span{font-size:13px;color:var(--t2)}

.rest{text-align:center;padding:26px 18px}
.rest .big{font-size:44px;line-height:1;margin-bottom:6px}
.rest h2{margin:6px 0 4px;font-size:24px;font-weight:800;letter-spacing:-.5px}
.rest p{color:var(--t2);margin:0 auto 16px;max-width:360px}

.extra ol{margin:8px 0 0;padding:0;list-style:none;counter-reset:x}
.extra li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);counter-increment:x;font-size:14px}
.extra li::before{content:counter(x);font-weight:800;color:var(--strength);width:16px;flex:none}
.extra li span{margin-left:auto;color:var(--mut);font-size:12.5px;text-align:right;white-space:nowrap;padding-left:8px}
.tomorrow{display:flex;align-items:center;gap:12px;color:var(--t2);font-size:14px}
.tomorrow svg{width:22px;height:22px;color:var(--mut);flex:none}

/* ---------- diario ---------- */
.weeknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.weeknav b{flex:1;text-align:center;font-weight:700}
.weeknav button{width:42px;height:42px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center}
.weeknav button svg{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center}
.tile b{display:block;font-size:20px;font-weight:800;letter-spacing:-.5px}
.tile small{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.day{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.day.today{border-color:var(--hot)}
.day .dn{width:40px;text-align:center;flex:none}
.day .dn b{display:block;font-size:18px;font-weight:800;line-height:1}
.day .dn small{font-size:10.5px;color:var(--mut);text-transform:uppercase;font-weight:700;letter-spacing:.8px}
.day .sporticon{width:36px;height:36px;border-radius:11px}
.day .sporticon svg{width:20px;height:20px}
.day .info{flex:1;min-width:0}
.day .info b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .info small{color:var(--mut);font-size:12.5px}
.st{font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap}
.st.done{background:rgba(59,232,137,.15);color:var(--green)}
.st.skip{background:var(--s3);color:var(--mut)}
.st.plan{background:rgba(255,164,28,.15);color:var(--hot2)}
.st.rest{background:none;color:var(--mut)}
.streak{display:flex;align-items:center;gap:14px}
.streak .fire{font-size:34px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}

/* ---------- profilo ---------- */
.set{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .l{flex:1;min-width:0}
.set .l b{display:block;font-size:14.5px;font-weight:600}
.set .l small{color:var(--mut);font-size:12.5px;display:block}
.set .v{width:118px;flex:none}
.set .v.w{width:150px}
.dayset{display:grid;grid-template-columns:46px 1fr 96px 90px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.dayset:first-of-type{border-top:0}
.dayset b{font-size:14px}
.dayset select{padding:8px 26px 8px 10px;font-size:13px;border-radius:10px;background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%}
.dayset .off{opacity:.35;pointer-events:none}
.help{font-size:13px;color:var(--t2);background:var(--s2);border-radius:14px;padding:12px 14px;margin:10px 0}
.help ol{margin:6px 0 0;padding-left:18px}
.help li{margin:3px 0}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.status i{width:9px;height:9px;border-radius:50%;background:var(--mut)}
.status.ok i{background:var(--green);box-shadow:0 0 0 4px rgba(59,232,137,.18)}
.status.err i{background:var(--red)}
.results button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px;background:var(--s2);margin-top:6px;font-size:14px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:18px 0}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 16px calc(10px + var(--safe-b));background:linear-gradient(rgba(11,12,16,0),var(--bg) 35%)}
nav .in{max-width:420px;margin:0 auto;display:flex;background:rgba(29,32,41,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:6px}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:16px;font-size:11.5px;font-weight:600;color:var(--mut)}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--text);background:var(--s3)}
nav button.on svg{color:var(--hot2)}

/* ---------- sheet & toast ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex;animation:fade .2s}
.sheet .pane{background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:10px 16px calc(20px + var(--safe-b))}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--s3);margin:4px auto 12px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.spin{animation:rot 1s linear infinite} @keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="brand"><img src="logo.png" alt=""><div><b>SMG</b><small>Sudo Ma Godo</small></div></div>
  <button class="wx" id="wx" aria-label="Meteo"></button>
</header>
<main>
  <section class="view on" id="v-oggi"></section>
  <section class="view" id="v-diario"></section>
  <section class="view" id="v-profilo"></section>
</main>
<nav><div class="in">
  <button data-v="oggi" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>Oggi</button>
  <button data-v="diario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Diario</button>
  <button data-v="profilo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profilo</button>
</div></nav>
<div class="sheet" id="sheet"><div class="pane"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
